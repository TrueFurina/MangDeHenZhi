# Dependabot 自动依赖更新配置
# 每周一自动检查 Maven / npm / GitHub Actions 的依赖更新并创建 PR。
# https://docs.github.com/en/code-security/dependabot
#
# ── 为什么分组（2026-10-17 调整）────────────────────────────────────────
# 旧配置下「一个依赖一个 PR」：3 个生态 × open-pull-requests-limit 10
# = 每周最多 30 个 PR。实际观测到一次积压 21 个依赖 PR，其中绝大多数是
# patch/minor —— 本可以一起合，却被拆成十几个 PR、跑十几次 CI、产生十几次通知。
#
# 现在分两类：
#   1. patch + minor → 每个生态**合并成一个 PR**（走 auto-merge.yml 的自动合并）
#   2. major         → 仍然单独开（需要逐个迁移；混在一起会变成「要么全合、要么全不合」）
# ──────────────────────────────────────────────────────────────────────

version: 2
updates:
  # ===== Maven (Java 后端) =====
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    groups:
      maven-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ===== npm (Vue 前端) =====
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    # ---------------------------------------------------------------------------
    # ignore：typescript 7 目前升不了，加版本天花板（2026-10-19 实测复查）
    #
    # 根因：vue-tsc（含最新 3.3.13）内部 require('typescript/lib/tsc')，
    # 而 TypeScript 7 的 package.json exports 已不再暴露 './lib/tsc' 子路径：
    #
    #   Error [ERR_PACKAGE_PATH_NOT_EXPORTED]: Package subpath './lib/tsc'
    #   is not defined by "exports" in .../node_modules/typescript/package.json
    #       at resolveTscPath (vue-tsc/index.js:73:43)
    #
    # 注意 vue-tsc 的 peer 写的是 typescript >=5.0.0（不排除 7），所以
    # 这不是 peer 冲突、npm 装得上，但一跑 `vue-tsc` 就立刻抛错，
    # CI 的 type-check / build 必红。必须等 vue-tsc 发布适配 TS7 的版本。
    # ---------------------------------------------------------------------------
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      npm-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ===== GitHub Actions =====
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
